name: Build ChatGPTRepair single rootless DEB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Makefile'
      - 'control'
      - 'ChatGPTRepair.plist'
      - 'scripts/package_combined.py'
      - 'vendor/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  combined-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Theos and iOS 16.5 SDK
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg ldid
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          curl -fL --retry 3 -o "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
          tar -xJf "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" -C "$HOME/theos/sdks"

      - name: Restore and verify exact compatibility component
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, pathlib
          encoded = pathlib.Path('vendor/compatibility-2.3.5.deb.b64').read_text()
          raw = base64.b64decode(''.join(encoded.split()), validate=True)
          actual = hashlib.sha256(raw).hexdigest()
          expected = '35a7b8724e36fbe9ccef9b4a2186d18eced6af6ebbeeb3bdb98b6f4e51b5e419'
          if actual != expected:
              raise SystemExit('Compatibility binary SHA256 mismatch: ' + actual)
          pathlib.Path('vendor/compatibility-2.3.5.deb').write_bytes(raw)
          print('Verified compatibility binary: %d bytes; SHA256 %s' % (len(raw), actual))
          PY
          test "$(dpkg-deb -f vendor/compatibility-2.3.5.deb Version)" = "2.3.5"

      - name: Compile preserved v53 source from main
        shell: bash
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          test "$(awk '/^Version:/ { print $2; exit }' control)" = "0.53.0"
          set +e
          make package FINALPACKAGE=1 > "$RUNNER_TEMP/chatgptrepair-build.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/chatgptrepair-build.log"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          shopt -s nullglob
          debs=(packages/*.deb)
          test "${#debs[@]}" -eq 1
          test "$(dpkg-deb -f "${debs[0]}" Package)" = "com.551uk.chatgptrepair"
          test "$(dpkg-deb -f "${debs[0]}" Version)" = "0.53.0"
          rootless_lib="$(mktemp -d)"
          dpkg-deb -x "${debs[0]}" "$rootless_lib"
          nm -gU "$rootless_lib/var/jb/Library/MobileSubstrate/DynamicLibraries/ChatGPTRepair.dylib" | grep -F '_CGRCompatibilityEnsureLoaded' >/dev/null
          mkdir -p build-input
          cp "${debs[0]}" build-input/v53.deb

      - name: Combine into one ChatGPTRepair rootless installer
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package_combined.py \
            --repair build-input/v53.deb \
            --compat vendor/compatibility-2.3.5.deb \
            --version 0.55.0 \
            --out dist/ChatGPTRepair_0.55.0_iphoneos-arm64.deb
          test "$(dpkg-deb -f dist/ChatGPTRepair_0.55.0_iphoneos-arm64.deb Package)" = "com.551uk.chatgptrepair"
          test "$(dpkg-deb -f dist/ChatGPTRepair_0.55.0_iphoneos-arm64.deb Version)" = "0.55.0"
          python3 - <<'PY'
          import hashlib, pathlib, subprocess, tempfile
          target='var/jb/Library/MobileSubstrate/DynamicLibraries'
          with tempfile.TemporaryDirectory() as d:
              d=pathlib.Path(d)
              for name,deb in [('repair','build-input/v53.deb'),('compat','vendor/compatibility-2.3.5.deb'),('merged','dist/ChatGPTRepair_0.55.0_iphoneos-arm64.deb')]:
                  out=d/name
                  subprocess.run(['dpkg-deb','-x',deb,str(out)],check=True)
              for stem,orig in [('ChatGPTRepair','repair'),('ChatGBeFree','compat')]:
                  for ext in ('dylib','plist'):
                      filename=stem+'.'+ext
                      source=(d/orig/target/filename).read_bytes()
                      output=(d/'merged'/target/filename).read_bytes()
                      assert source==output, filename+' differs in combined DEB'
                      print(filename,'verified SHA256',hashlib.sha256(output).hexdigest())
              assert len(list((d/'merged'/target).glob('*.dylib')))==2, 'Unexpected dylib count'
          PY

      - name: Record failure details for repair
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build-reports
          {
            echo "ChatGPTRepair v0.55 build failure"
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID"
            echo "Date (UTC): $(date -u)"
            echo "--- Compiler output (last 150 lines) ---"
            if [ -f "$RUNNER_TEMP/chatgptrepair-build.log" ]; then
              tail -n 150 "$RUNNER_TEMP/chatgptrepair-build.log"
            else
              echo "Compilation was never reached; check preceding workflow steps."
            fi
          } > .build-reports/v55-failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .build-reports/v55-failure.txt
          git commit -m "CI failure evidence for v0.55 (temporary)" || exit 0
          git push origin HEAD:main

      - name: Save single installation DEB as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTRepair-0.55.0-single-DEB
          path: dist/ChatGPTRepair_0.55.0_iphoneos-arm64.deb
          if-no-files-found: error

      - name: Publish single-package release (keep v53 recovery until verified)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v0.55.0"
          artifact="dist/ChatGPTRepair_0.55.0_iphoneos-arm64.deb"
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          # ChatGPTRepair 0.55.0

          Single installable rootless Dopamine package for the legacy ChatGPT iOS 16 application.

          - Compiles the preserved v0.53.0 history, pagination, pinned-chat and pin/unpin repair from source in main.
          - Bundles the exact separately preserved 2.3.5 compatibility, voice, model, image, and copy component as a precompiled dylib.
          - Includes both original dylibs and injection plists without byte changes. Sileo shows one ChatGPTRepair package.
          - Replaces the separately installed com.liam.chatgbefree package.
          - v0.55.0 TEST: CompatibilityBootstrap.m preloads the bundled 2.3.5 dylib before the v53 history constructor and writes a temporary diagnostic log at Library/Caches/ChatGPTRepair-CompatProbe.log.\n          - The temporary compatibility log MUST BE REMOVED in the final release; see FINAL_RELEASE_CHECKLIST.md.\n          - Force-close the ChatGPT app and respring after installing.\n          - This is a combined build, NOT a fully editable source rewrite of the precompiled 2.3.5 component. Third-party ownership and GPL obligations remain.
          - On-device feature parity and compatibility startup must be tested before removing working recovery releases.
          NOTES
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$artifact" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$artifact" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ChatGPTRepair v0.55.0 — One DEB" --notes-file "$RUNNER_TEMP/notes.md"
          fi

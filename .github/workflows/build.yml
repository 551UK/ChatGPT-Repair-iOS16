name: Build ChatGPTRepair

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Makefile'
      - 'control'
      - 'ChatGPTRepair.plist'
      - 'README.md'
      - 'tests/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and Theos
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg ldid xz
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          curl -fL --retry 3             -o "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz"             "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
          tar -xJf "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" -C "$HOME/theos/sdks"

      - name: Run regression checks
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/check_clean_release.py
          python3 tests/check_history_refresh.py
          python3 tests/check_sidebar_restore.py
          python3 tests/check_renderer_citation_guard.py
          clang -fobjc-arc -fblocks -framework Foundation             src/HistoryOriginMerge.m tests/HistoryOriginMergeTests.m             -o "$RUNNER_TEMP/HistoryOriginMergeTests"
          "$RUNNER_TEMP/HistoryOriginMergeTests"
          clang -fobjc-arc -fblocks -framework Foundation             src/CitationCompat.m src/RichMarkupCompat.m tests/CitationCompatTests.m             -o "$RUNNER_TEMP/CitationCompatTests"
          "$RUNNER_TEMP/CitationCompatTests"

      - name: Compile current core
        shell: bash
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          make clean
          make package FINALPACKAGE=1
          deb="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb"
          mkdir -p build/newcore
          dpkg-deb -x "$deb" build/newcore
          test -f build/newcore/var/jb/Library/MobileSubstrate/DynamicLibraries/ChatGPTRepair.dylib
          test -f build/newcore/var/jb/Library/MobileSubstrate/DynamicLibraries/ChatGPTRepair.plist

      - name: Download current production package
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/base-artifact
          if gh release download v57.2             --repo "$GITHUB_REPOSITORY"             --pattern "ChatGPTRepair_iphoneos-arm64.deb"             --dir build/base-artifact 2>/dev/null; then
            cp build/base-artifact/ChatGPTRepair_iphoneos-arm64.deb build/base.deb
          else
            gh release download v57.2               --repo "$GITHUB_REPOSITORY"               --pattern "ChatGPTRepair_57.2_iphoneos-arm64.deb"               --dir build/base-artifact
            cp build/base-artifact/ChatGPTRepair_57.2_iphoneos-arm64.deb build/base.deb
          fi
          test "$(dpkg-deb -f build/base.deb Package)" = "com.551uk.chatgptrepair"

      - name: Build clean production package
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/pkgroot build/basecheck build/finalcheck dist
          mkdir -p build/pkgroot build/basecheck build/finalcheck dist
          dpkg-deb -R build/base.deb build/pkgroot

          target="build/pkgroot/var/jb/Library/MobileSubstrate/DynamicLibraries"
          cp build/newcore/var/jb/Library/MobileSubstrate/DynamicLibraries/ChatGPTRepair.dylib "$target/ChatGPTRepair.dylib"
          cp ChatGPTRepair.plist "$target/ChatGPTRepair.plist"
          cp control build/pkgroot/DEBIAN/control

          dpkg-deb --root-owner-group -b build/pkgroot dist/ChatGPTRepair_iphoneos-arm64.deb
          test "$(dpkg-deb -f dist/ChatGPTRepair_iphoneos-arm64.deb Package)" = "com.551uk.chatgptrepair"

          dpkg-deb -x build/base.deb build/basecheck
          dpkg-deb -x dist/ChatGPTRepair_iphoneos-arm64.deb build/finalcheck
          base="build/basecheck/var/jb/Library/MobileSubstrate/DynamicLibraries"
          final="build/finalcheck/var/jb/Library/MobileSubstrate/DynamicLibraries"

          for file in             ChatGBeFree.dylib ChatGBeFree.plist             ZZChatGPTDownloadFix.dylib ZZChatGPTDownloadFix.plist             ZZChatGPTLinkFix.dylib ZZChatGPTLinkFix.plist; do
            cmp "$base/$file" "$final/$file"
          done

          test -f "$final/ChatGPTRepair.dylib"
          test "$(find "$final" -maxdepth 1 -name '*.dylib' | wc -l | tr -d ' ')" = "4"
          test ! -e "$final/ZZZZChatGPTBlankDiag.dylib"
          test ! -e "$final/ZZZZChatGPTSidebarBlankDiag.dylib"
          test ! -e "$final/ZZZZZChatGPTSidebarTrace.dylib"

      - name: Publish clean release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v57.2"
          asset="dist/ChatGPTRepair_iphoneos-arm64.deb"

          gh release upload "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$tag"             --repo "$GITHUB_REPOSITORY"             --title "ChatGPTRepair"             --notes ""

          current_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.id')"

          # Remove every older release entry and its tag.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases"             --jq '.[] | [.id, .tag_name] | @tsv' |
          while IFS=$'\t' read -r release_id release_tag; do
            [ -n "$release_id" ] || continue
            if [ "$release_id" != "$current_id" ]; then
              gh release delete "$release_tag"                 --repo "$GITHUB_REPOSITORY"                 --cleanup-tag                 --yes
            fi
          done

          # Keep exactly one .deb on the current release.
          gh api "repos/$GITHUB_REPOSITORY/releases/$current_id/assets"             --jq '.[] | select(.name | endswith(".deb")) | [.id, .name] | @tsv' |
          while IFS=$'\t' read -r asset_id name; do
            [ -n "$asset_id" ] || continue
            if [ "$name" != "ChatGPTRepair_iphoneos-arm64.deb" ]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            fi
          done

          test "$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].id' | wc -l | tr -d ' ')" -eq 1
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$current_id/assets"             --jq '[.[] | select(.name | endswith(".deb"))] | length')" -eq 1
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$current_id" --jq '.body // ""')" = ""
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$current_id" --jq '.name')" = "ChatGPTRepair"

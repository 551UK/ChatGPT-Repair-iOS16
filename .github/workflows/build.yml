name: Build ChatGPTRepair single rootless DEB

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Makefile'
      - 'control'
      - 'ChatGPTRepair.plist'
      - 'README.md'
      - 'tests/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write
  actions: read

jobs:
  clean-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and Theos
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg ldid xz
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          curl -fL --retry 3 \
            -o "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" \
            "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
          tar -xJf "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" -C "$HOME/theos/sdks"
          test -d "$HOME/theos/sdks/iPhoneOS16.5.sdk"

      - name: Run source regression checks
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/check_clean_release.py
          python3 tests/check_history_refresh.py
          python3 tests/check_sidebar_restore.py
          clang -fobjc-arc -fblocks -framework Foundation \
            src/HistoryOriginMerge.m tests/HistoryOriginMergeTests.m \
            -o "$RUNNER_TEMP/HistoryOriginMergeTests"
          "$RUNNER_TEMP/HistoryOriginMergeTests"
          clang -fobjc-arc -fblocks -framework Foundation \
            src/CitationCompat.m src/RichMarkupCompat.m tests/CitationCompatTests.m \
            -o "$RUNNER_TEMP/CitationCompatTests"
          "$RUNNER_TEMP/CitationCompatTests"
          test "$(awk '/^Version:/ { print $2; exit }' control)" = "56.6"

      - name: Compile v56.6 core from main source
        shell: bash
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          make clean
          make package FINALPACKAGE=1
          shopt -s nullglob
          debs=(packages/*.deb)
          test "${#debs[@]}" -eq 1
          test "$(dpkg-deb -f "${debs[0]}" Package)" = "com.551uk.chatgptrepair"
          test "$(dpkg-deb -f "${debs[0]}" Version)" = "56.6"
          mkdir -p build/newcore
          dpkg-deb -x "${debs[0]}" build/newcore
          test -f build/newcore/var/jb/Library/MobileSubstrate/DynamicLibraries/ChatGPTRepair.dylib
          test -f build/newcore/var/jb/Library/MobileSubstrate/DynamicLibraries/ChatGPTRepair.plist
          strings build/newcore/var/jb/Library/MobileSubstrate/DynamicLibraries/ChatGPTRepair.dylib | grep -F "X-551UK-Detail-Retry" >/dev/null
          strings build/newcore/var/jb/Library/MobileSubstrate/DynamicLibraries/ChatGPTRepair.dylib | grep -F "X-551UK-History-Cache" >/dev/null
          strings build/newcore/var/jb/Library/MobileSubstrate/DynamicLibraries/ChatGPTRepair.dylib | grep -F "content_references" >/dev/null

      - name: Download exact clean v56.5 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/base-artifact
          gh release download v56.5 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "ChatGPTRepair_56.5_iphoneos-arm64.deb" \
            --dir build/base-artifact
          cp build/base-artifact/ChatGPTRepair_56.5_iphoneos-arm64.deb build/ChatGPTRepair_56.5_iphoneos-arm64.deb
          actual="$(shasum -a 256 build/ChatGPTRepair_56.5_iphoneos-arm64.deb | awk '{print $1}')"
          expected="244bc840576f026fc743d6424fde01ea95b2b5ef7a4395ff25f341a83daf09a9"
          test "$actual" = "$expected"
          test "$(dpkg-deb -f build/ChatGPTRepair_56.5_iphoneos-arm64.deb Version)" = "56.5"

      - name: Build clean v56.6 package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/pkgroot build/basecheck build/finalcheck dist
          mkdir -p build/pkgroot build/basecheck build/finalcheck dist
          dpkg-deb -R build/ChatGPTRepair_56.5_iphoneos-arm64.deb build/pkgroot

          target="build/pkgroot/var/jb/Library/MobileSubstrate/DynamicLibraries"
          cp build/newcore/var/jb/Library/MobileSubstrate/DynamicLibraries/ChatGPTRepair.dylib "$target/ChatGPTRepair.dylib"
          cp ChatGPTRepair.plist "$target/ChatGPTRepair.plist"

          python3 - <<'PY'
          from pathlib import Path
          p=Path("build/pkgroot/DEBIAN/control")
          text=p.read_text()
          if "Version: 56.5\n" not in text:
              raise SystemExit("Expected v56.5 baseline")
          p.write_text(text.replace("Version: 56.5\n","Version: 56.6\n",1))
          PY

          dpkg-deb --root-owner-group -b build/pkgroot dist/ChatGPTRepair_56.6_iphoneos-arm64.deb
          test "$(dpkg-deb -f dist/ChatGPTRepair_56.6_iphoneos-arm64.deb Package)" = "com.551uk.chatgptrepair"
          test "$(dpkg-deb -f dist/ChatGPTRepair_56.6_iphoneos-arm64.deb Version)" = "56.6"

      - name: Verify clean package and preserved working components
        shell: bash
        run: |
          set -euo pipefail
          dpkg-deb -x build/ChatGPTRepair_56.5_iphoneos-arm64.deb build/basecheck
          dpkg-deb -x dist/ChatGPTRepair_56.6_iphoneos-arm64.deb build/finalcheck
          base="build/basecheck/var/jb/Library/MobileSubstrate/DynamicLibraries"
          final="build/finalcheck/var/jb/Library/MobileSubstrate/DynamicLibraries"

          for file in \
            ChatGBeFree.dylib ChatGBeFree.plist \
            ZZChatGPTDownloadFix.dylib ZZChatGPTDownloadFix.plist \
            ZZChatGPTLinkFix.dylib ZZChatGPTLinkFix.plist; do
            cmp "$base/$file" "$final/$file"
          done

          cmp ChatGPTRepair.plist "$final/ChatGPTRepair.plist"
          test -f "$final/ChatGPTRepair.dylib"

          # Clean release must contain only the four production dylibs.
          test "$(find "$final" -maxdepth 1 -name '*.dylib' | wc -l | tr -d ' ')" = "4"
          test ! -e "$final/ZZZZChatGPTBlankDiag.dylib"
          test ! -e "$final/ZZZZChatGPTBlankDiag.plist"
          test ! -e "$final/ZZChatGPTLinkFix1.dylib"
          test ! -e "$final/ZZChatGPTLinkFix2.dylib"

          if strings "$final/ChatGPTRepair.dylib" | grep -E 'ChatGPTBlankChatsDiag|ChatGPT551Repair\.log|CGRLog\(|CGPLog\(|CGCacheLog\(' >/dev/null; then
            echo "Diagnostic logging found in clean core"
            exit 1
          fi

          python3 - <<'PY'
          import subprocess
          deb="dist/ChatGPTRepair_56.6_iphoneos-arm64.deb"
          contents=subprocess.check_output(["dpkg-deb","-c",deb],text=True)
          paths=[line.split(" ./",1)[1].strip() for line in contents.splitlines() if " ./" in line]
          bad=[p for p in paths if p not in ("","var/","var") and not p.startswith("var/")]
          if bad:
              raise SystemExit("Found non-rootless payload path: "+repr(bad))
          print("Verified rootless payload paths:",len(paths))
          PY

          shasum -a 256 dist/ChatGPTRepair_56.6_iphoneos-arm64.deb

      - name: Upload clean v56.6 DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTRepair-56.6-clean
          path: dist/ChatGPTRepair_56.6_iphoneos-arm64.deb
          if-no-files-found: error

      - name: Publish ChatGPTRepair v56.6
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v56.6"
          artifact="dist/ChatGPTRepair_56.6_iphoneos-arm64.deb"
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          Restores conversation detail loading when returning from the sidebar to an unchanged selected conversation.

          - Hooks the existing history sidebar disappearance lifecycle.
          - If no detail request started and the selected chat is unchanged, reselects it after a short delay.
          - Avoids interrupting native selection of a different conversation or retry requests.
          - Keeps normal URL/download labels untouched.
          - Preserves v56.5 rich markup, citation and product cleanup, web/file citation compatibility, blank-chat retries, history, pin/unpin, downloads and compatibility components.
          - The separate blank-chat diagnostic tweak remains independent and is not bundled.
          NOTES
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$artifact" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ChatGPTRepair v56.6" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - name: Verify final release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v56.6 --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -Fxq "ChatGPTRepair_56.6_iphoneos-arm64.deb"
          gh release view v56.5 --repo "$GITHUB_REPOSITORY" >/dev/null

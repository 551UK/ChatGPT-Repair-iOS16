name: Build ChatGPTRepair single rootless DEB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Makefile'
      - 'control'
      - 'ChatGPTRepair.plist'
      - 'scripts/package_combined.py'
      - 'tests/**'
      - 'vendor/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  combined-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Theos and iOS 16.5 SDK
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg ldid
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          curl -fL --retry 3 -o "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
          tar -xJf "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" -C "$HOME/theos/sdks"

      - name: Restore and verify exact compatibility component
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, pathlib
          encoded = pathlib.Path('vendor/compatibility-2.3.5.deb.b64').read_text()
          raw = base64.b64decode(''.join(encoded.split()), validate=True)
          actual = hashlib.sha256(raw).hexdigest()
          expected = '35a7b8724e36fbe9ccef9b4a2186d18eced6af6ebbeeb3bdb98b6f4e51b5e419'
          if actual != expected:
              raise SystemExit('Compatibility binary SHA256 mismatch: ' + actual)
          pathlib.Path('vendor/compatibility-2.3.5.deb').write_bytes(raw)
          print('Verified compatibility binary: %d bytes; SHA256 %s' % (len(raw), actual))
          PY
          test "$(dpkg-deb -f vendor/compatibility-2.3.5.deb Version)" = "2.3.5"

      - name: Check no diagnostic log writers remain
        shell: bash
        run: |
          python3 tests/check_clean_release.py

      - name: Check normal history refresh regression
        shell: bash
        run: |
          python3 tests/check_history_refresh.py

      - name: Compile ChatGPTRepair sources from main
        shell: bash
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          test "$(awk '/^Version:/ { print $2; exit }' control)" = "55.3"
          set +e
          make package FINALPACKAGE=1 > "$RUNNER_TEMP/chatgptrepair-build.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/chatgptrepair-build.log"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          shopt -s nullglob
          debs=(packages/*.deb)
          test "${#debs[@]}" -eq 1
          test "$(dpkg-deb -f "${debs[0]}" Package)" = "com.551uk.chatgptrepair"
          test "$(dpkg-deb -f "${debs[0]}" Version)" = "55.3"
          rootless_lib="$(mktemp -d)"
          dpkg-deb -x "${debs[0]}" "$rootless_lib"
          nm -gU "$rootless_lib/var/jb/Library/MobileSubstrate/DynamicLibraries/ChatGPTRepair.dylib" | grep -F '_CGRCompatibilityEnsureLoaded' >/dev/null
          mkdir -p build-input
          cp "${debs[0]}" build-input/chatgptrepair-base.deb

      - name: Combine into one ChatGPTRepair rootless installer
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package_combined.py \
            --repair build-input/chatgptrepair-base.deb \
            --compat vendor/compatibility-2.3.5.deb \
            --version 55.3 \
            --out dist/ChatGPTRepair_55.3_iphoneos-arm64.deb
          test "$(dpkg-deb -f dist/ChatGPTRepair_55.3_iphoneos-arm64.deb Package)" = "com.551uk.chatgptrepair"
          test "$(dpkg-deb -f dist/ChatGPTRepair_55.3_iphoneos-arm64.deb Version)" = "55.3"
          python3 - <<'PY'
          import subprocess
          deb='dist/ChatGPTRepair_55.3_iphoneos-arm64.deb'
          contents=subprocess.check_output(['dpkg-deb','-c',deb],text=True)
          paths=[line.split(' ./',1)[1].strip() for line in contents.splitlines() if ' ./' in line]
          bad=[p for p in paths if p not in ('','var/','var') and not p.startswith('var/')]
          assert not bad, 'Read-only iOS system path in DEB: '+repr(bad)
          assert any('var/jb/usr/share/doc/chatgptrepair/' in p for p in paths), 'Missing rootless docs'
          print('Verified all',len(paths),'archive members remain under rootless /var/jb')
          PY
          python3 - <<'PY'
          import hashlib, pathlib, subprocess, tempfile
          target='var/jb/Library/MobileSubstrate/DynamicLibraries'
          with tempfile.TemporaryDirectory() as d:
              d=pathlib.Path(d)
              for name,deb in [('repair','build-input/chatgptrepair-base.deb'),('compat','vendor/compatibility-2.3.5.deb'),('merged','dist/ChatGPTRepair_55.3_iphoneos-arm64.deb')]:
                  out=d/name
                  subprocess.run(['dpkg-deb','-x',deb,str(out)],check=True)
              for stem,orig in [('ChatGPTRepair','repair'),('ChatGBeFree','compat')]:
                  for ext in ('dylib','plist'):
                      filename=stem+'.'+ext
                      source=(d/orig/target/filename).read_bytes()
                      output=(d/'merged'/target/filename).read_bytes()
                      assert source==output, filename+' differs in combined DEB'
                      print(filename,'verified SHA256',hashlib.sha256(output).hexdigest())
              assert len(list((d/'merged'/target).glob('*.dylib')))==2, 'Unexpected dylib count'
          PY

      - name: Save single installation DEB as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTRepair-55.3-single-DEB
          path: dist/ChatGPTRepair_55.3_iphoneos-arm64.deb
          if-no-files-found: error

      - name: Publish ChatGPTRepair release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v55.3"
          artifact="dist/ChatGPTRepair_55.3_iphoneos-arm64.deb"
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          Fixes normal chat-list refresh on iOS 16.
          NOTES
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$artifact" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$artifact" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ChatGPTRepair v55.3" --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - name: Verify new release and preserve working rollback
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v55.3 --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -Fxq "ChatGPTRepair_55.3_iphoneos-arm64.deb"
          gh release view v55.2 --repo "$GITHUB_REPOSITORY" >/dev/null

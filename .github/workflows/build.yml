name: Build ChatGPT Repair Rootless

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Makefile'
      - 'control'
      - 'ChatGPTRepair.plist'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Theos and iOS 16.5 SDK
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg ldid
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          curl -fL --retry 3 -o "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
          tar -xJf "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" -C "$HOME/theos/sdks"
      - name: Build rootless package
        shell: bash
        run: |
          export THEOS="$HOME/theos"
          make package FINALPACKAGE=1
      - name: Save DEB as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Repair-iOS16-rootless
          path: packages/*.deb
          if-no-files-found: error
      - name: Publish versioned GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/^Version:/ { print $2; exit }' control)"
          test -n "$version"
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it unchanged."
            exit 0
          fi
          shopt -s nullglob
          debs=(packages/*.deb)
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "Expected one DEB, found ${#debs[@]}" >&2
            exit 1
          fi
          mkdir -p release
          output="release/ChatGPT-Repair-iOS16_${version}_iphoneos-arm64.deb"
          cp "${debs[0]}" "$output"
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## ChatGPT Repair iOS16 — 551UK

          First experimental rootless companion tweak for **ChatGPT 1.2024.200 on iOS 16**.

          - v0.4.0 uses passive network diagnostics only; it does not intercept, rewrite, replay or cache-bypass user requests. This isolates possible conflicts with the existing ChatGBeFree networking hooks.
          - Compares sanitized response structures for history lists and conversation initialization to investigate missing sidebar conversations and attachment controls in all existing chats.
          - All tweak source code and GitHub Actions build scripts are in this repository.

          **Important:** This version is a *diagnostic companion*, not a complete ChatGBeFree replacement or a verified repair. Keep ChatGBeFree 2.3.5 installed to retain its existing working features. Neither missing history nor missing attachments is fixed by this package. Install and test at your own risk; remove this companion package if it interferes with the ChatGPT app.

          See the README for testing and diagnostics. Credit to Liam / ChatGBeFree for the upstream GPLv3 version-spoof concept; no third-party compiled dylib is included.
          NOTES
          gh release create "$tag" "$output" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ChatGPT Repair iOS16 $tag (551UK) — Experimental" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

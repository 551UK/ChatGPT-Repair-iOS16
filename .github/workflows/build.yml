# Build, test and publish the unified ChatGPTRepair rootless installer.
name: Build ChatGPTRepair

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'upstream/chatgbefree/**'
      - 'Makefile'
      - 'control'
      - 'ChatGPTRepair.plist'
      - 'README.md'
      - 'tests/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: chatgptrepair-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and Theos
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg ldid xz
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          curl -fL --retry 3             -o "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz"             "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
          tar -xJf "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" -C "$HOME/theos/sdks"

      - name: Run regression checks
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/check_clean_release.py
          python3 tests/check_history_refresh.py
          python3 tests/check_sidebar_restore.py
          python3 tests/check_renderer_citation_guard.py
          clang -fobjc-arc -fblocks -framework Foundation             src/HistoryOriginMerge.m tests/HistoryOriginMergeTests.m             -o "$RUNNER_TEMP/HistoryOriginMergeTests"
          "$RUNNER_TEMP/HistoryOriginMergeTests"
          clang -fobjc-arc -fblocks -framework Foundation             src/ConversationPagingCore.m tests/ConversationPagingCoreTests.m             -o "$RUNNER_TEMP/ConversationPagingCoreTests"
          "$RUNNER_TEMP/ConversationPagingCoreTests"
          clang -fobjc-arc -fblocks -framework Foundation             src/CitationCompat.m src/RichMarkupCompat.m tests/CitationCompatTests.m             -o "$RUNNER_TEMP/CitationCompatTests"
          "$RUNNER_TEMP/CitationCompatTests"

      - name: Compile source-only unified tweak
        shell: bash
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          make clean package FINALPACKAGE=1
          deb="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          mkdir -p dist build/source-only-check
          cp "$deb" dist/ChatGPTRepair_iphoneos-arm64.deb
          dpkg-deb -x "$deb" build/source-only-check
          test "$(dpkg-deb -f "$deb" Package)" = "com.551uk.chatgptrepair"
          expected_version="$(sed -n 's/^Version:[[:space:]]*//p' control | head -n 1)"
          test "$(dpkg-deb -f "$deb" Version)" = "$expected_version"
          target="build/source-only-check/var/jb/Library/MobileSubstrate/DynamicLibraries"
          test -f "$target/ChatGPTRepair.dylib"
          test -f "$target/ChatGPTRepair.plist"
          test "$(find "$target" -maxdepth 1 -type f -name '*.dylib' | wc -l | tr -d ' ')" -eq 1
          test "$(find "$target" -maxdepth 1 -type f -name '*.plist' | wc -l | tr -d ' ')" -eq 1
          test ! -e "$target/ChatGBeFree.dylib"
          test ! -e "$target/ZZChatGPTDownloadFix.dylib"
          test ! -e "$target/ZZChatGPTLinkFix.dylib"

      - name: Upload test installer
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTRepair-source-only-test
          path: dist/ChatGPTRepair_iphoneos-arm64.deb

      - name: Publish clean release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -n 's/^Version:[[:space:]]*//p' control | head -n1)"
          test -n "$version"
          tag="v$version"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "ChatGPTRepair" --notes ""
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "ChatGPTRepair" --notes ""
          fi

          gh release upload "$tag" dist/ChatGPTRepair_iphoneos-arm64.deb \
            --repo "$GITHUB_REPOSITORY" --clobber

          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.id')"

          # Keep one clean release only, and remove stale release tags such as v57.2.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' |
          while read -r old_tag; do
            [ -n "$old_tag" ] || continue
            if [ "$old_tag" != "$tag" ]; then
              gh release delete "$old_tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            fi
          done

          test "$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].id' | wc -l | tr -d ' ')" -eq 1
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
            --jq '[.[] | select(.name | endswith(".deb"))] | length')" -eq 1
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
            --jq '[.[] | select(.name == "ChatGPTRepair_iphoneos-arm64.deb")] | length')" -eq 1
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq '.body // ""')" = ""
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq '.name')" = "ChatGPTRepair"

      - name: Remove obsolete branches and tags
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$(sed -n 's/^Version:[[:space:]]*//p' control | head -n1)"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.tag_name')" = "$tag"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '[.assets[] | select(.name == "ChatGPTRepair_iphoneos-arm64.deb")] | length')" -eq 1
          gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' |
          while IFS= read -r old_branch; do
            [ -n "$old_branch" ] || continue
            [ "$old_branch" = "main" ] && continue
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$old_branch" >/dev/null
            echo "Removed branch: $old_branch"
          done
          gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags" --jq '.[].ref' |
          while IFS= read -r old_ref; do
            [ -n "$old_ref" ] || continue
            [ "$old_ref" = "refs/tags/$tag" ] && continue
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/$old_ref" >/dev/null
            echo "Removed tag: $old_ref"
          done
          test "$(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' | grep -c .)" -eq 1
          test "$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags" --jq '.[].ref' | grep -c .)" -eq 1

name: Build ChatGPT Repair Rootless

on:
  workflow_dispatch:
  push:
    branches: [main, 'work/v046-direct-native-selection']
    paths:
      - 'src/**'
      - 'Makefile'
      - 'control'
      - 'ChatGPTRepair.plist'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Theos and iOS 16.5 SDK
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg ldid
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          curl -fL --retry 3 -o "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
          tar -xJf "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" -C "$HOME/theos/sdks"
      - name: Build rootless package
        shell: bash
        run: |
          export THEOS="$HOME/theos"
          make package FINALPACKAGE=1
      - name: Save DEB as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Repair-iOS16-rootless
          path: packages/*.deb
          if-no-files-found: error
      - name: Publish v0.53.0 installable DEB
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/^Version:/ {print $2;exit}' control)"
          test -n "$version"
          tag="v$version"
          shopt -s nullglob
          debs=(packages/*.deb)
          test "${#debs[@]}" -eq 1
          mkdir -p release
          output="release/ChatGPT-Repair-iOS16_${version}_iphoneos-arm64.deb"
          cp "${debs[0]}" "$output"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$output" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$output" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "ChatGPT Repair iOS16 $tag (551UK)" \
              --notes 'Based on preserved v0.52.0: retries failed older-history pages at offset 20, 40 etc with bounded rate-limit backoff. Keeps v52 pin/unpin, pinned section, chat navigation and history cache. Experimental; install with Dopamine rootless on iOS 16. This does not fix phone-created conversations missing from the browser.'
          fi

name: Build Sidebar Blank Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - 'diagnostics/SidebarBlankDiag/**'
      - '.github/workflows/build-sidebar-blank-diag.yml'
  push:
    branches: [main]
    paths:
      - 'diagnostics/SidebarBlankDiag/**'
      - '.github/workflows/build-sidebar-blank-diag.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and Theos
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg ldid xz
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          curl -fL --retry 3 \
            -o "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" \
            "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
          tar -xJf "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" -C "$HOME/theos/sdks"
          test -d "$HOME/theos/sdks/iPhoneOS16.5.sdk"

      - name: Static diagnostic-safety checks
        shell: bash
        run: |
          set -euo pipefail
          src="diagnostics/SidebarBlankDiag/Tweak.m"
          grep -F 'ChatGPTSidebarBlankDiag.log' "$src" >/dev/null
          grep -F 'dataTaskWithRequest:' "$src" >/dev/null
          grep -F 'SIDEBAR TRANSITION' "$src" >/dev/null
          grep -F 'viewDidDisappear:' "$src" >/dev/null
          grep -F 'MEMORY_WARNING' "$src" >/dev/null
          ! grep -E 'CG46OpenPin|HTTPBody[[:space:]]*=|setHTTPBody|cancelByProducingResumeData' "$src"
          test "$(awk '/^Version:/ { print $2; exit }' diagnostics/SidebarBlankDiag/control)" = "1.0"

      - name: Build standalone rootless diagnostic
        shell: bash
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          cd diagnostics/SidebarBlankDiag
          make clean
          make package FINALPACKAGE=1
          shopt -s nullglob
          debs=(packages/*.deb)
          test "${#debs[@]}" -eq 1
          test "$(dpkg-deb -f "${debs[0]}" Package)" = "com.551uk.chatgptsidebarblankdiag"
          test "$(dpkg-deb -f "${debs[0]}" Version)" = "1.0"
          mkdir -p ../../dist
          cp "${debs[0]}" ../../dist/ChatGPTSidebarBlankDiag_1.0_iphoneos-arm64.deb

      - name: Verify payload is diagnostic only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/diagcheck
          mkdir -p build/diagcheck
          dpkg-deb -x dist/ChatGPTSidebarBlankDiag_1.0_iphoneos-arm64.deb build/diagcheck
          dir="build/diagcheck/var/jb/Library/MobileSubstrate/DynamicLibraries"
          test -f "$dir/ZZZZChatGPTSidebarBlankDiag.dylib"
          test -f "$dir/ZZZZChatGPTSidebarBlankDiag.plist"
          test "$(find "$dir" -maxdepth 1 -type f | wc -l | tr -d ' ')" = "2"
          strings "$dir/ZZZZChatGPTSidebarBlankDiag.dylib" | grep -F 'ChatGPTSidebarBlankDiag.log' >/dev/null
          strings "$dir/ZZZZChatGPTSidebarBlankDiag.dylib" | grep -F 'SIDEBAR TRANSITION' >/dev/null
          strings "$dir/ZZZZChatGPTSidebarBlankDiag.dylib" | grep -F 'DETAIL_JSON' >/dev/null
          shasum -a 256 dist/ChatGPTSidebarBlankDiag_1.0_iphoneos-arm64.deb

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTSidebarBlankDiag-1.0
          path: dist/ChatGPTSidebarBlankDiag_1.0_iphoneos-arm64.deb
          if-no-files-found: error

      - name: Publish diagnostic release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="diag-sidebar-v1.0"
          deb="dist/ChatGPTSidebarBlankDiag_1.0_iphoneos-arm64.deb"
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          Passive diagnostic for the ChatGPT sidebar-return blank-chat bug.

          - Logs actual sidebar visible/hidden transitions using window hit-testing.
          - Logs HistoryViewController lifecycle callbacks.
          - Logs conversation/history/pin NSURLSession requests, completions, cancellations and response summaries.
          - Logs UI/controller/scroll-view snapshots around sidebar open/close and memory warnings.
          - Does not modify response data, force chat selection, clear caches, or replace the production ChatGPTRepair tweak.
          - Log is recreated on each ChatGPT launch at ChatGPT's app Documents/ChatGPTSidebarBlankDiag.log.
          NOTES
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$deb" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$deb" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ChatGPT Sidebar Blank Diagnostic v1.0" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - name: Verify diagnostic release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view diag-sidebar-v1.0 --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -Fxq 'ChatGPTSidebarBlankDiag_1.0_iphoneos-arm64.deb'

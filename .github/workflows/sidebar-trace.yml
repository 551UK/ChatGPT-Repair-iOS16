name: Build Sidebar Mutation Trace

on:
  push:
    branches: [main]
    paths:
      - 'diag/SidebarMutationTrace/**'
      - '.github/workflows/sidebar-trace.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools and Theos
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg ldid xz
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          curl -fL --retry 3             -o "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz"             "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
          tar -xJf "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" -C "$HOME/theos/sdks"
      - name: Build diagnostic
        shell: bash
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          cd diag/SidebarMutationTrace
          make clean
          make package FINALPACKAGE=1
          deb="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = "com.551uk.chatgptsidebartrace"
          test "$(dpkg-deb -f "$deb" Version)" = "1.0.0"
          cp "$deb" "$GITHUB_WORKSPACE/ChatGPTSidebarTrace_1.0.0_iphoneos-arm64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: ChatGPTSidebarTrace-1.0.0
          path: ChatGPTSidebarTrace_1.0.0_iphoneos-arm64.deb
      - name: Publish diagnostic release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="diag-sidebar-trace-v1"
          asset="ChatGPTSidebarTrace_1.0.0_iphoneos-arm64.deb"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$asset"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "ChatGPT Sidebar Mutation Trace v1.0.0"               --notes "Targeted diagnostic only. Logs history-request and Messages collection/data-source call stacks to ChatGPTSidebarTrace.log. Does not modify conversation data."
          fi

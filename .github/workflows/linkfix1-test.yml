name: Build ChatGPTRepair link fix2 test

on:
  workflow_dispatch:
  push:
    branches: [linkfix1test]
    paths:
      - 'link-test/**'
      - '.github/workflows/linkfix1-test.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg ldid xz

      - name: Download iOS 16.5 SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/ios-sdk"
          curl -fL --retry 3 \
            -o "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" \
            "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
          tar -xJf "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" -C "$HOME/ios-sdk"
          test -d "$HOME/ios-sdk/iPhoneOS16.5.sdk"

      - name: Compile separate link fix test dylib
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          SDK="$HOME/ios-sdk/iPhoneOS16.5.sdk"
          clang \
            -target arm64-apple-ios16.0 \
            -isysroot "$SDK" \
            -fobjc-arc -fblocks \
            -dynamiclib \
            -framework Foundation \
            -framework UIKit \
            -Wno-deprecated-declarations \
            -Wl,-install_name,/var/jb/Library/MobileSubstrate/DynamicLibraries/ZZChatGPTLinkFix2.dylib \
            link-test/ZZChatGPTLinkFix2.m \
            -o build/ZZChatGPTLinkFix2.dylib
          ldid -S build/ZZChatGPTLinkFix2.dylib
          file build/ZZChatGPTLinkFix2.dylib

      - name: Download exact released v55.6 baseline
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            -o build/ChatGPTRepair_55.6_iphoneos-arm64.deb \
            "https://github.com/551UK/ChatGPT-Repair-iOS16/releases/download/v55.6/ChatGPTRepair_55.6_iphoneos-arm64.deb"
          actual="$(shasum -a 256 build/ChatGPTRepair_55.6_iphoneos-arm64.deb | awk '{print $1}')"
          expected="461d57449b13b1bba10fca9ae142e185bcded16f18b2db6c6126b6dd1fcb65e6"
          test "$actual" = "$expected"
          test "$(dpkg-deb -f build/ChatGPTRepair_55.6_iphoneos-arm64.deb Version)" = "55.6"

      - name: Add only link fix test dylib to v55.6
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/pkgroot
          mkdir -p build/pkgroot dist
          dpkg-deb -R build/ChatGPTRepair_55.6_iphoneos-arm64.deb build/pkgroot

          target="build/pkgroot/var/jb/Library/MobileSubstrate/DynamicLibraries"
          cp build/ZZChatGPTLinkFix2.dylib "$target/ZZChatGPTLinkFix2.dylib"
          cat > "$target/ZZChatGPTLinkFix2.plist" <<'PLIST'
          { Filter = { Bundles = ( "com.openai.chat" ); }; }
          PLIST

          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/pkgroot/DEBIAN/control")
          text = p.read_text()
          old = "Version: 55.6\n"
          if old not in text:
              raise SystemExit("55.6 control version not found")
          p.write_text(text.replace(old, "Version: 55.7-linkfix2test\n", 1))
          PY

          dpkg-deb --root-owner-group -b build/pkgroot dist/ChatGPTRepair_55.7-linkfix2test_iphoneos-arm64.deb
          test "$(dpkg-deb -f dist/ChatGPTRepair_55.7-linkfix2test_iphoneos-arm64.deb Package)" = "com.551uk.chatgptrepair"
          test "$(dpkg-deb -f dist/ChatGPTRepair_55.7-linkfix2test_iphoneos-arm64.deb Version)" = "55.7-linkfix2test"

      - name: Verify v55.6 baseline files remain byte-for-byte unchanged
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/basecheck build/newcheck
          mkdir -p build/basecheck build/newcheck
          dpkg-deb -x build/ChatGPTRepair_55.6_iphoneos-arm64.deb build/basecheck
          dpkg-deb -x dist/ChatGPTRepair_55.7-linkfix2test_iphoneos-arm64.deb build/newcheck
          target="var/jb/Library/MobileSubstrate/DynamicLibraries"

          for f in ChatGPTRepair.dylib ChatGPTRepair.plist ChatGBeFree.dylib ChatGBeFree.plist ZZChatGPTDownloadFix.dylib ZZChatGPTDownloadFix.plist; do
            cmp "build/basecheck/$target/$f" "build/newcheck/$target/$f"
          done
          test -f "build/newcheck/$target/ZZChatGPTLinkFix2.dylib"
          test -f "build/newcheck/$target/ZZChatGPTLinkFix2.plist"

      - name: Upload link fix test DEB
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTRepair-55.7-linkfix2test
          path: dist/ChatGPTRepair_55.7-linkfix2test_iphoneos-arm64.deb
          if-no-files-found: error
